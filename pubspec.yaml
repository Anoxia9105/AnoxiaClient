name: anoxia
description: "A high-performance, real-time IM (Instant Messaging) solution built with Flutter and Dart. Supports low-latency message delivery and robust state synchronization."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
# Mobile: 1.0.8 
version: 1.0.9
# Desktop: 1.0.8
# version: 1.0.7

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  # 屏幕适配
  flutter_screenutil: ^5.9.3
  # Riverpod状态管理
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^4.0.2
  # http网络请求
  dio: ^5.9.0
  # 路由跳转
  go_router: ^17.0.0
  # 控制台日志走 debugPrint（release 下 assert 剥离，零开销），不引入日志库
  # 本地存储
  shared_preferences: ^2.5.3
  # 安全存储
  flutter_secure_storage: ^10.3.0
  # 网络状态监测
  connectivity_plus: ^7.0.0
  # 权限管理
  permission_handler: ^12.0.1
  # 地图相关
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  # 定位
  geolocator: ^14.0.2
  # 国际化
  easy_localization: ^3.0.8
  # 图标库
  hugeicons: ^1.1.5
  # 列表相关
  flutter_list_view: ^1.1.29
  # 滚动定位列表
  scrollable_positioned_list: ^0.3.8
  # rtc
  livekit_client: ^2.7.0
  flutter_webrtc: ^1.4.0
  # socket
  web_socket_channel: ^3.0.3
  # win toolbar
  tray_manager: ^0.5.2
  # 富文本编辑器
  flutter_quill: ^11.5.1
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  # Web 平台文件处理
  cross_file: ^0.3.5+4
  # 缓存
  #cached_network_image: ^3.4.1
  cross_cache: ^1.1.0
  # 图片查看
  photo_view: ^0.15.0
  window_manager:
    git:
      url: https://github.com/boyan01/window_manager.git
      path: packages/window_manager
      ref: 6fae92d21b4c80ce1b8f71c1190d7970cf722bd4
  # toast
  bot_toast: ^4.1.3
  # 长连接
  #  flutter_client_sse: ^2.0.3
   #link 打开链接
  url_launcher: ^6.3.2
  # 字母列表
  alphabet_list_view: ^1.2.0
  # 拼音
  lpinyin: ^2.0.3
  # 多窗口
  desktop_multi_window: ^0.3.0
  # 文件选择
  file_picker: ^11.0.2
  # 桌面/Web PC 自定义视频背景
  video_player: ^2.13.0
  video_player_win: ^3.2.2
  # uuid
  uuid: ^4.5.2
  # 包信息
  package_info_plus: ^9.0.0
  # 路径管理
  path_provider: ^2.1.5
  # 打开文件
  open_filex: ^4.7.0
  # 版本号
  pub_semver: ^2.2.0
  path: ^1.9.1
  characters: ^1.4.0
  intl: ^0.20.2
  share_plus: ^12.0.2
  # Web 平台 JS 交互：dart:js / dart:js_util在 Wasm 下不可用
  web: ^1.0.0
  # 图片处理
  image: ^4.7.2
  # emoji 选择器
  emoji_picker_flutter: ^4.4.0
  # 本地通知
  flutter_local_notifications: ^21.0.0
  # Android/iOS/macOS角标
  app_badge_plus: ^1.3.1
  # 剪贴板
  pasteboard: ^0.5.0
  # 动画
  flutter_staggered_animations: ^1.1.1
  # 抽屉
  flutter_zoom_drawer: ^3.2.0
  # 快捷键
  hotkey_manager: ^0.2.3
  # 后台
  flutter_background: ^1.3.1
  # 画中画 Android/IOS
  pip: ^0.0.3
  # 音频播放
  just_audio: ^0.10.5
  # 音频波形
  audio_waveforms: ^2.0.2
  # 极光推送
  jpush_flutter: ^3.4.5
  # fcm google firebase cloud messaging
  firebase_core: ^4.10.0
  firebase_messaging: ^16.0.2
  # 字体
  google_fonts: ^8.1.0
  # 聊天输入容器
  # 底部输入栏
  chat_bottom_container: ^0.5.0
  # 扫码
  mobile_scanner: ^7.1.3
  # 二维码
  qr_flutter: ^4.1.0
  # 相册保存
  image_gallery_saver_plus: ^5.0.0
  # 图片裁剪
  image_cropper: ^12.2.1
  # 图片选择
  image_picker: ^1.2.2
  html: ^0.15.6
  http: ^1.6.0
  # 设备信息
  device_info_plus: ^12.3.0
  # 本地数据库
  drift: ^2.34.0
  # drift 依赖
  sqlite3_flutter_libs: ^0.5.40


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  riverpod_lint: ^3.1.3
  build_runner: ^2.15.0
  drift_dev: ^2.34.0
  flutter_gen_runner: ^5.12.0
  go_router_builder: ^4.1.3
  flutter_oss_licenses: ^3.2.0
  connectivity_plus_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.8

dependency_overrides:
  sqlparser: 0.44.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/images/
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # 应用默认字体（桌面/移动端注册；Web 构建由 tool_build.ps1 自动剔除，
  # Web 端强制使用浏览器系统字体）
  fonts:
    - family: HarmonyOS
      fonts:
        - asset: assets/fonts/HarmonyOS.ttf
