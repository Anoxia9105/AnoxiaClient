name: anoxia
description: "A high-performance, real-time IM (Instant Messaging) solution built with Flutter and Dart. Supports low-latency message delivery and robust state synchronization."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 2.4.8+54

environment:
  sdk: ^3.10.1

dependencies:
  # —— Flutter SDK（必选）——
  flutter:
    sdk: flutter

  # —— 状态管理 + 路由 ——
  flutter_riverpod: ^3.0.3 # 全局状态管理
  riverpod_annotation: ^4.0.2 # Provider 代码生成注解
  go_router: ^17.0.0 # 声明式路由

  # —— 网络通信 ——
  dio: ^5.9.0 # HTTP 请求
  http: ^1.6.0 # 轻量 HTTP（部分场景复用）
  web_socket_channel: ^3.0.3 # WS 长连接
  connectivity_plus: ^7.0.0 # 网络状态监听

  # —— V6 协议（IM 编解码真源，不可删） ——
  protobuf: ^6.0.0 # protobuf 运行时
  fixnum: ^1.1.1 # 64 位整数
  anoxia_protocol:
    path: ../AnoxiaProtocol/gen/dart # 本地 path 依赖，需先跑 ../AnoxiaProtocol/tool_generate_dart 生成

  # —— 本地存储 + 数据库 ——
  shared_preferences: ^2.5.3 # 轻量 KV 存储
  flutter_secure_storage: ^10.3.0 # 安全存储（token 等敏感信息）
  path_provider: ^2.1.5 # 系统目录路径
  path: ^1.9.1 # 路径拼接
  drift: ^2.34.0 # 本地关系数据库 ORM
  sqlite3_flutter_libs: ^0.5.40 # drift 的 sqlite 原生库
  cross_cache: ^1.1.0 # 跨平台缓存（图片等）

  # —— 国际化 + 基础工具 ——
  easy_localization: ^3.0.8 # 多语言（zh/en/ja）
  intl: ^0.20.2 # 日期数字格式化（easy_localization 依赖保持一致）
  uuid: ^4.5.2 # 客户端消息 ID 等唯一标识
  characters: ^1.4.0 # Unicode 字符处理
  pub_semver: ^2.2.0 # 版本号比较（更新检查）
  crypto: ^3.0.7 # SHA-256（更新安装包完整性校验）
  package_info_plus: ^9.0.0 # 应用包信息（版本号）
  device_info_plus: ^12.3.0 # 设备信息
  url_launcher: ^6.3.2 # 外链跳转（隐私政策/条款/GitHub）
  share_plus: ^12.0.2 # 系统分享
  open_filex: ^4.7.0 # 第三方应用打开文件
  web: ^1.0.0 # Web JS 互操作（Wasm 下替代 dart:js）
  html: ^0.15.6 # HTML 解析（富文本/粘贴场景）

  # —— UI 基础组件 ——
  flutter_screenutil: ^5.9.3 # 屏幕适配
  hugeicons: ^1.1.5 # 图标库
  bot_toast: ^4.1.3 # Toast/loading 提示
  flutter_list_view: ^1.1.29 # 高性能列表
  scrollable_positioned_list: ^0.3.8 # 可定位滚动列表（聊天记录跳转）
  alphabet_list_view: ^1.2.0 # 联系人字母索引列表
  lpinyin: ^2.0.3 # 汉字转拼音（联系人排序/搜索）
  photo_view: ^0.15.0 # 图片查看（缩放）
  flutter_staggered_animations: ^1.1.1 # 列表交错动画
  flutter_zoom_drawer: ^3.2.0 # 抽屉菜单
  emoji_picker_flutter: ^4.4.0 # emoji 选择器
  qr_flutter: ^4.1.0 # 二维码生成（名片/加好友）
  chat_bottom_container: ^0.5.0 # 聊天底部输入容器

  # —— 富文本编辑 + Markdown（Quill 相关放一起） ——
  flutter_quill: ^11.5.1 # 富文本编辑器（聊天输入/记事本）
  dart_quill_delta: ^10.8.3 # Quill Delta 数据结构
  flutter_quill_delta_from_html: 1.5.3 # HTML ↔ Delta 互转
  flutter_markdown_plus: ^1.0.12 # Markdown 渲染（原 flutter_markdown 已停更，官方指定替代包）
  markdown: 7.3.1 # Markdown 解析

  # —— 图片 / 文件 / 音视频播放 ——
  image: ^4.7.2 # 图片编解码/压缩
  image_picker: ^1.2.2 # 图片选择（相册/相机）
  image_cropper: ^12.2.1 # 图片裁剪（原生插件，走 shim）
  image_gallery_saver_plus: ^5.0.0 # 保存到相册（原生插件，走 shim）
  file_picker: ^11.0.2 # 文件选择
  cross_file: ^0.3.5+4 # Web 文件对象封装
  desktop_drop: ^0.8.4 # 桌面聊天文件拖放
  video_player: ^2.13.0 # 视频播放
  video_player_win: ^3.2.2 # Windows 视频播放实现
  just_audio: ^0.10.5 # 音频播放（语音消息）
  audio_waveforms: ^2.0.2 # 音频波形条
  pdf: ^3.12.0 # 记事本 PDF 导出

  # —— 地图定位 ——
  flutter_map: ^8.3.1 # 地图渲染
  latlong2: ^0.10.1 # 经纬度计算
  geolocator: ^14.0.2 # 系统定位

  # —— 音视频通话（RTC） ——
  # livekit_client 必须 pin 死：room_controller 直引其 AudioManager，
  # 版本漂移（lock 未入库，各机器独立解析）曾导致 web-wasm 编译失败。
  # 升级前必须全端（apk/ipa/win/web-js/web-wasm）验证通过。
  livekit_client: 2.13.1 # LiveKit 通话信令+媒体
  flutter_webrtc: ^1.4.0 # WebRTC 底层

  # —— 推送 + 通知 + 后台 ——
  jpush_flutter: ^3.4.5 # 极光推送（国内）
  firebase_core: ^4.10.0 # FCM 前置（海外推送）
  firebase_messaging: ^16.0.2 # FCM 消息
  flutter_local_notifications: ^21.0.0 # 本地通知
  app_badge_plus: ^1.3.1 # 应用角标（Android/iOS/macOS）
  flutter_background: ^1.3.1 # 后台保活（原生插件，走 shim）
  pip: ^0.0.3 # 画中画（Android/iOS，原生插件，走 shim）

  # —— 桌面窗口 + 系统集成 ——
  # window_manager 用 git fork 而不用 pub 版本号的原因：
  # 上游 leanflutter 版更新慢且正在向 nativeapi-flutter 迁移，
  # boyan01（上游贡献者）的 fork 包含新 Flutter 构建修复；
  # 用 git + ref 锁定提交，保证各机器构建结果一致、不随 pub 发版漂移。
  window_manager:
    git:
      url: https://github.com/boyan01/window_manager.git
      path: packages/window_manager
      ref: 6fae92d21b4c80ce1b8f71c1190d7970cf722bd4
  tray_manager: ^0.5.2 # 系统托盘（桌面端）
  desktop_multi_window: ^0.3.0 # 桌面多窗口（通话独立窗口，原生插件，走 shim）
  hotkey_manager: ^0.2.3 # 全局快捷键（桌面端，原生插件，走 shim）
  pasteboard: ^0.5.0 # 剪贴板（富文本/图片粘贴）
  launch_at_startup: ^0.5.1 # 开机自启（Windows/Linux/macOS，走 shim 隔离）

  # —— 移动端原生能力 ——
  permission_handler: ^12.0.1 # 权限申请（相机/相册/麦克风等）
  mobile_scanner: ^7.1.3 # 扫码（原生插件，走 shim，仅原生移动端）
  camera: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0 # 官方 lint 规则
  riverpod_generator: ^4.0.3 # Provider 代码生成
  riverpod_lint: ^3.1.3 # Riverpod 专用 lint
  build_runner: ^2.15.0 # 代码生成入口
  drift_dev: ^2.34.0 # drift 表结构生成
  flutter_gen_runner: ^5.12.0 # 资源（assets/fonts）生成
  go_router_builder: ^4.1.3 # 路由代码生成
  flutter_oss_licenses: ^3.2.0 # 开源许可页生成（lib/oss_licenses.dart）
  connectivity_plus_platform_interface: ^2.1.0 # 网络状态 mock（测试用）
  plugin_platform_interface: ^2.1.8 # 插件接口基类（测试用）
  camera_platform_interface: ^2.14.0 # 相机交互与生命周期 mock（测试用）

dependency_overrides:
  sqlparser: 0.44.0 # 锁定 drift 传递依赖版本，避免解析器漂移导致生成代码不一致

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/images/
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # 应用默认字体：JetBrains Mono（拉丁/等宽）+ NotoSansSC（CJK 回退）
  # 全平台强制使用（含 Web，不再回退系统字体）
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono[wght].ttf
        - asset: assets/fonts/JetBrainsMono-Italic[wght].ttf
          style: italic
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC[wght].ttf
