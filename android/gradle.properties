org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.daemon=false
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
kotlin.jvm.target.validation.mode=warning
android.useAndroidX=true
android.enableJetifier=true
# AGP 9 兼容现有 Flutter/华为及第三方插件；全部迁移后再启用新 DSL 和内置 Kotlin。
android.newDsl=false
android.builtInKotlin=false
# Workaround for Flutter IconTreeShakerException on release build.
# tree-shake-icons=false
