<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anoxia · 新建日程弹窗设计稿</title>
  <style>
    :root {
      color-scheme: light;
      --accent: #5e66d0;
      --accent-hover: #5058bf;
      --on-accent: #ffffff;
      --accent-soft: #e7e7ff;
      --on-accent-soft: #191b57;
      --canvas: #e9ebf2;
      --scrim: rgba(18, 20, 29, 0.52);
      --surface: #fbf8ff;
      --surface-low: #f5f2fa;
      --surface-high: #ebe8f1;
      --field: #f8f5fd;
      --text: #1b1b21;
      --muted: #666672;
      --outline: #c9c6d0;
      --outline-soft: #e1dee8;
      --danger: #ba1a1a;
      --shadow: 0 24px 80px rgba(16, 18, 34, 0.24), 0 4px 20px rgba(16, 18, 34, 0.14);
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 24px;
    }

    body.dark {
      color-scheme: dark;
      --canvas: #111217;
      --scrim: rgba(0, 0, 0, 0.66);
      --surface: #1c1b20;
      --surface-low: #222126;
      --surface-high: #2c2a31;
      --field: #25242a;
      --text: #e6e1e9;
      --muted: #c9c5d0;
      --outline: #918f9a;
      --outline-soft: #45434b;
      --accent-soft: #45456f;
      --on-accent-soft: #e2e0ff;
      --shadow: 0 28px 90px rgba(0, 0, 0, 0.52);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--text);
      background: var(--canvas);
      font-family: Inter, "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      transition: background .2s ease, color .2s ease;
    }

    button, input, textarea { font: inherit; }
    button { color: inherit; }

    .prototype-bar {
      position: fixed;
      z-index: 20;
      top: 16px;
      left: 50%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border: 1px solid color-mix(in srgb, var(--outline) 72%, transparent);
      border-radius: 16px;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      box-shadow: 0 8px 28px rgba(18, 20, 29, .16);
      backdrop-filter: blur(18px);
      transform: translateX(-50%);
    }

    .prototype-bar button {
      min-height: 36px;
      padding: 0 13px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
    }

    .prototype-bar button.active {
      color: var(--on-accent-soft);
      background: var(--accent-soft);
    }

    .divider { width: 1px; height: 24px; background: var(--outline-soft); }

    .stage {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 84px 24px 32px;
      overflow: hidden;
      background:
        linear-gradient(var(--scrim), var(--scrim)),
        radial-gradient(circle at 15% 15%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 34%),
        var(--canvas);
    }

    .dialog {
      width: min(920px, calc(100vw - 48px));
      height: min(760px, calc(100vh - 112px));
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      border: 1px solid color-mix(in srgb, var(--outline-soft) 82%, transparent);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .dialog-header {
      min-height: 76px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px 14px 24px;
      border-bottom: 1px solid var(--outline-soft);
      background: var(--surface);
    }

    .event-mark {
      width: 44px;
      height: 44px;
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 13px;
      color: var(--on-accent-soft);
      background: var(--accent-soft);
    }

    .event-mark svg { width: 23px; height: 23px; }

    .header-copy { min-width: 0; flex: 1; }
    .header-copy h1 { margin: 0; font-size: 19px; line-height: 1.3; letter-spacing: -.01em; }
    .header-copy p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }

    .icon-button {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
    }

    .icon-button:hover { background: var(--surface-high); }
    .icon-button svg { width: 21px; height: 21px; }

    .dialog-body {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.13fr) minmax(320px, .87fr);
      overflow: hidden;
    }

    .column {
      min-height: 0;
      overflow: auto;
      padding: 24px;
      scrollbar-width: thin;
      scrollbar-color: var(--outline) transparent;
    }

    .column + .column {
      border-left: 1px solid var(--outline-soft);
      background: var(--surface-low);
    }

    .field { margin-bottom: 18px; }
    .field:last-child { margin-bottom: 0; }

    .label {
      display: block;
      margin: 0 0 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .02em;
    }

    .title-input {
      width: 100%;
      padding: 3px 0 10px;
      border: 0;
      border-bottom: 2px solid var(--outline-soft);
      outline: none;
      color: var(--text);
      background: transparent;
      font-size: 26px;
      font-weight: 720;
      letter-spacing: -.02em;
    }

    .title-input:focus { border-color: var(--accent); }
    .title-input::placeholder { color: color-mix(in srgb, var(--muted) 65%, transparent); }

    .text-field {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid var(--outline-soft);
      border-radius: var(--radius-sm);
      outline: none;
      color: var(--text);
      background: var(--field);
      transition: border-color .14s ease, box-shadow .14s ease;
    }

    textarea.text-field { min-height: 112px; resize: vertical; line-height: 1.55; }
    .text-field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }

    .location-wrap { position: relative; }
    .location-wrap svg {
      position: absolute;
      top: 14px;
      left: 14px;
      width: 19px;
      height: 19px;
      color: var(--muted);
      pointer-events: none;
    }
    .location-wrap .text-field { padding-left: 43px; }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 0 10px;
    }
    .section-title h2 { margin: 0; font-size: 14px; }

    .switch-line { display: inline-flex; align-items: center; gap: 9px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .switch { position: relative; width: 38px; height: 22px; display: inline-block; }
    .switch input { position: absolute; opacity: 0; }
    .switch span { position: absolute; inset: 0; border-radius: 20px; background: var(--outline); cursor: pointer; transition: .18s ease; }
    .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: .18s ease; }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::after { transform: translateX(16px); background: var(--on-accent); }

    .time-card {
      border: 1px solid var(--outline-soft);
      border-radius: var(--radius-md);
      background: var(--surface);
      overflow: hidden;
    }

    .time-row {
      min-height: 66px;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
    }
    .time-row + .time-row { border-top: 1px solid var(--outline-soft); }
    .time-kind { color: var(--muted); font-size: 12px; font-weight: 680; }
    .date-main { display: block; font-size: 14px; font-weight: 700; }
    .date-sub { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .time-pill {
      min-width: 76px;
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid var(--outline);
      border-radius: 10px;
      color: var(--text);
      background: transparent;
      cursor: pointer;
      font-variant-numeric: tabular-nums;
      font-weight: 680;
    }
    .time-pill:hover { border-color: var(--accent); background: var(--accent-soft); }

    .options-list {
      border: 1px solid var(--outline-soft);
      border-radius: var(--radius-md);
      background: var(--surface);
      overflow: visible;
    }

    .option-row {
      position: relative;
      min-height: 60px;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
    }
    .option-row + .option-row { border-top: 1px solid var(--outline-soft); }
    .option-icon { width: 34px; height: 34px; display: grid; place-items: center; color: var(--muted); }
    .option-icon svg { width: 20px; height: 20px; }
    .option-name { display: block; font-size: 13px; font-weight: 680; }
    .option-hint { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }

    .select-trigger {
      min-height: 38px;
      max-width: 170px;
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      padding: 0 9px 0 12px;
      border: 0;
      border-radius: 9px;
      color: var(--text);
      background: var(--surface-high);
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }
    .select-trigger:hover, .select-trigger[aria-expanded="true"] { color: var(--on-accent-soft); background: var(--accent-soft); }
    .select-trigger svg { width: 16px; height: 16px; transition: transform .15s ease; }
    .select-trigger[aria-expanded="true"] svg { transform: rotate(180deg); }

    .menu {
      position: absolute;
      z-index: 8;
      top: calc(100% - 5px);
      right: 12px;
      width: 210px;
      display: none;
      padding: 6px;
      border: 1px solid var(--outline-soft);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 12px 36px rgba(18, 20, 29, .22);
    }
    .menu.open { display: block; animation: menu-in .14s ease-out; }
    @keyframes menu-in { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
    .menu button {
      width: 100%;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      text-align: left;
      font-size: 13px;
    }
    .menu button:hover { background: var(--surface-high); }
    .menu button.selected { color: var(--accent); font-weight: 720; }
    .menu .check { opacity: 0; }
    .menu button.selected .check { opacity: 1; }

    .repeat-panel {
      display: none;
      margin-top: 12px;
      padding: 14px;
      border: 1px solid var(--outline-soft);
      border-radius: var(--radius-md);
      background: var(--surface);
    }
    .repeat-panel.visible { display: block; }
    .repeat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .mini-field { padding: 10px 12px; border: 1px solid var(--outline-soft); border-radius: 10px; background: var(--field); }
    .mini-field small { display: block; color: var(--muted); font-size: 10px; }
    .mini-field strong { display: block; margin-top: 4px; font-size: 13px; }
    .weekday-row { display: flex; justify-content: space-between; gap: 5px; margin-top: 12px; }
    .weekday {
      width: 32px;
      height: 32px;
      border: 1px solid var(--outline-soft);
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }
    .weekday.selected { color: var(--on-accent); border-color: var(--accent); background: var(--accent); }

    .colors { display: flex; flex-wrap: wrap; gap: 11px; }
    .color {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 2px solid transparent;
      border-radius: 50%;
      background: var(--swatch);
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
    }
    .color.selected { border-color: var(--surface); outline: 2px solid var(--text); }
    .color svg { width: 14px; height: 14px; color: white; opacity: 0; }
    .color.selected svg { opacity: 1; }

    .dialog-footer {
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      border-top: 1px solid var(--outline-soft);
      background: var(--surface);
    }
    .footer-spacer { flex: 1; }

    .button {
      min-height: 44px;
      padding: 0 18px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 720;
    }
    .button.ghost:hover { background: var(--surface-high); }
    .button.danger { color: var(--danger); background: transparent; }
    .button.danger:hover { background: color-mix(in srgb, var(--danger) 9%, transparent); }
    .button.primary { min-width: 108px; color: var(--on-accent); background: var(--accent); box-shadow: 0 2px 7px color-mix(in srgb, var(--accent) 32%, transparent); }
    .button.primary:hover { background: var(--accent-hover); }

    .mobile-only,
    .mobile-delete { display: none; }

    body.mobile-preview .stage { align-items: end; padding: 72px 0 0; }
    body.mobile-preview .dialog {
      width: min(430px, 100vw);
      height: calc(100vh - 72px);
      max-height: 820px;
      border-width: 1px 0 0;
      border-radius: 24px 24px 0 0;
    }
    body.mobile-preview .dialog-body { display: block; overflow: auto; }
    body.mobile-preview .column { overflow: visible; padding: 20px; }
    body.mobile-preview .column + .column { border: 0; border-top: 1px solid var(--outline-soft); }
    body.mobile-preview .dialog-header { min-height: 66px; padding: 10px 10px 10px 18px; }
    body.mobile-preview .event-mark { width: 38px; height: 38px; border-radius: 11px; }
    body.mobile-preview .header-copy p { display: none; }
    body.mobile-preview .title-input { font-size: 23px; }
    body.mobile-preview .dialog-footer { padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); }
    body.mobile-preview .dialog-footer .danger { width: 44px; padding: 0; }
    body.mobile-preview .desktop-delete { display: none; }
    body.mobile-preview .mobile-delete { display: inline; }
    body.mobile-preview .mobile-only { display: block; }
    body.mobile-preview .menu { top: auto; bottom: calc(100% - 5px); }

    @media (max-width: 700px) {
      .prototype-bar { top: 8px; }
      .prototype-bar .desktop-control { display: none; }
      .stage { align-items: end; padding: 64px 0 0; }
      .dialog { width: 100%; height: calc(100vh - 64px); border-width: 1px 0 0; border-radius: 24px 24px 0 0; }
      .dialog-body { display: block; overflow: auto; }
      .column { overflow: visible; padding: 20px; }
      .column + .column { border-left: 0; border-top: 1px solid var(--outline-soft); }
      .dialog-header { min-height: 66px; padding: 10px 10px 10px 18px; }
      .event-mark { width: 38px; height: 38px; }
      .header-copy p { display: none; }
      .title-input { font-size: 23px; }
      .dialog-footer { padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); }
      .button.primary { flex: 1; }
      .footer-spacer { display: none; }
      .mobile-only { display: block; }
      .dialog-footer .danger { width: 44px; padding: 0; }
      .desktop-delete { display: none; }
      .mobile-delete { display: inline; }
      .menu { top: auto; bottom: calc(100% - 5px); }
    }

    @media (max-width: 380px) {
      .column { padding: 16px; }
      .time-row { grid-template-columns: 42px minmax(0, 1fr) auto; padding-inline: 11px; }
      .select-trigger { max-width: 142px; }
    }

    :focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 44%, transparent); outline-offset: 2px; }
  </style>
</head>
<body>
  <nav class="prototype-bar" aria-label="设计稿预览控制">
    <button class="desktop-control active" id="desktopMode" type="button">桌面弹窗</button>
    <button class="desktop-control" id="mobileMode" type="button">手机抽屉</button>
    <span class="divider" aria-hidden="true"></span>
    <button id="themeToggle" type="button" aria-pressed="false">切换深色</button>
  </nav>

  <main class="stage">
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <header class="dialog-header">
        <div class="event-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M8 15h.01M12 15h.01M16 15h.01" stroke-linecap="round"/></svg>
        </div>
        <div class="header-copy">
          <h1 id="dialogTitle">新建日程</h1>
          <p>安排时间、提醒和重复规则</p>
        </div>
        <button class="icon-button" type="button" aria-label="关闭弹窗">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18" stroke-linecap="round"/></svg>
        </button>
      </header>

      <div class="dialog-body">
        <div class="column">
          <div class="field">
            <label class="label" for="eventTitle">日程名称</label>
            <input class="title-input" id="eventTitle" value="产品体验评审" placeholder="准备做什么？" />
          </div>

          <div class="field">
            <label class="label" for="location">地点</label>
            <div class="location-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
              <input class="text-field" id="location" value="三楼会议室 · 线上同步" placeholder="添加地点或会议链接" />
            </div>
          </div>

          <div class="field">
            <div class="section-title">
              <h2>时间</h2>
              <label class="switch-line">全天
                <span class="switch"><input id="allDay" type="checkbox" /><span></span></span>
              </label>
            </div>
            <div class="time-card">
              <div class="time-row">
                <span class="time-kind">开始</span>
                <span><strong class="date-main">9月24日，星期四</strong><small class="date-sub">Asia/Shanghai</small></span>
                <button class="time-pill" type="button" data-time>09:30</button>
              </div>
              <div class="time-row">
                <span class="time-kind">结束</span>
                <span><strong class="date-main">9月24日，星期四</strong><small class="date-sub">持续 1 小时</small></span>
                <button class="time-pill" type="button" data-time>10:30</button>
              </div>
            </div>
          </div>

          <div class="field">
            <label class="label" for="notes">备注</label>
            <textarea class="text-field" id="notes" placeholder="添加议程、准备事项或相关说明…">确认移动端日程体验，讨论下一轮交互优化。</textarea>
          </div>
        </div>

        <aside class="column">
          <div class="field">
            <div class="section-title"><h2>日程设置</h2></div>
            <div class="options-list">
              <div class="option-row" data-select-row>
                <span class="option-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4" stroke-linecap="round"/></svg></span>
                <span><strong class="option-name">提醒</strong><small class="option-hint">到期前通知我</small></span>
                <button class="select-trigger" type="button" aria-expanded="false"><span>提前 15 分钟</span><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m5 7.5 5 5 5-5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                <div class="menu" role="menu">
                  <button type="button">不提醒 <span class="check">✓</span></button>
                  <button type="button">日程开始时 <span class="check">✓</span></button>
                  <button type="button" class="selected">提前 15 分钟 <span class="check">✓</span></button>
                  <button type="button">提前 30 分钟 <span class="check">✓</span></button>
                  <button type="button">提前 1 小时 <span class="check">✓</span></button>
                  <button type="button">提前 1 天 <span class="check">✓</span></button>
                </div>
              </div>

              <div class="option-row" data-select-row data-repeat-row>
                <span class="option-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4m14-1v2a3 3 0 0 1-3 3H3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                <span><strong class="option-name">重复</strong><small class="option-hint">创建周期性日程</small></span>
                <button class="select-trigger" type="button" aria-expanded="false"><span>不重复</span><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m5 7.5 5 5 5-5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                <div class="menu" role="menu">
                  <button type="button" class="selected">不重复 <span class="check">✓</span></button>
                  <button type="button">每天 <span class="check">✓</span></button>
                  <button type="button">每周 <span class="check">✓</span></button>
                  <button type="button">每月 <span class="check">✓</span></button>
                </div>
              </div>
            </div>

            <div class="repeat-panel" id="repeatPanel">
              <div class="repeat-grid">
                <div class="mini-field"><small>重复间隔</small><strong>每 1 周</strong></div>
                <div class="mini-field"><small>结束</small><strong>永不结束</strong></div>
              </div>
              <div class="weekday-row" aria-label="每周重复日期">
                <button class="weekday selected" type="button">一</button><button class="weekday" type="button">二</button><button class="weekday selected" type="button">三</button><button class="weekday" type="button">四</button><button class="weekday selected" type="button">五</button><button class="weekday" type="button">六</button><button class="weekday" type="button">日</button>
              </div>
            </div>
          </div>

          <div class="field">
            <label class="label">日程颜色</label>
            <div class="colors" role="radiogroup" aria-label="日程颜色">
              <button class="color selected" style="--swatch:#5E66D0" type="button" role="radio" aria-checked="true" aria-label="靛蓝"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m3 8 3 3 7-7"/></svg></button>
              <button class="color" style="--swatch:#2AA596" type="button" role="radio" aria-checked="false" aria-label="青绿"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m3 8 3 3 7-7"/></svg></button>
              <button class="color" style="--swatch:#2FA87A" type="button" role="radio" aria-checked="false" aria-label="翠绿"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m3 8 3 3 7-7"/></svg></button>
              <button class="color" style="--swatch:#E07A5F" type="button" role="radio" aria-checked="false" aria-label="珊瑚"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m3 8 3 3 7-7"/></svg></button>
              <button class="color" style="--swatch:#CE7A96" type="button" role="radio" aria-checked="false" aria-label="玫瑰"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m3 8 3 3 7-7"/></svg></button>
              <button class="color" style="--swatch:#7A6E9D" type="button" role="radio" aria-checked="false" aria-label="灰紫"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m3 8 3 3 7-7"/></svg></button>
            </div>
          </div>

          <p class="mobile-only" style="margin:8px 0 0;color:var(--muted);font-size:11px;line-height:1.5">手机端采用底部抽屉布局，滚动内容时标题和保存按钮保持可见。</p>
        </aside>
      </div>

      <footer class="dialog-footer">
        <button class="button danger" type="button"><span class="desktop-delete">删除日程</span><span class="mobile-delete">删除</span></button>
        <span class="footer-spacer"></span>
        <button class="button ghost" type="button">取消</button>
        <button class="button primary" type="button">保存日程</button>
      </footer>
    </section>
  </main>

  <script>
    const body = document.body;
    const desktopMode = document.querySelector('#desktopMode');
    const mobileMode = document.querySelector('#mobileMode');
    const themeToggle = document.querySelector('#themeToggle');

    desktopMode.addEventListener('click', () => {
      body.classList.remove('mobile-preview');
      desktopMode.classList.add('active');
      mobileMode.classList.remove('active');
    });
    mobileMode.addEventListener('click', () => {
      body.classList.add('mobile-preview');
      mobileMode.classList.add('active');
      desktopMode.classList.remove('active');
    });
    themeToggle.addEventListener('click', () => {
      const dark = body.classList.toggle('dark');
      themeToggle.textContent = dark ? '切换浅色' : '切换深色';
      themeToggle.setAttribute('aria-pressed', String(dark));
    });

    document.querySelectorAll('[data-select-row]').forEach((row) => {
      const trigger = row.querySelector('.select-trigger');
      const menu = row.querySelector('.menu');
      trigger.addEventListener('click', (event) => {
        event.stopPropagation();
        document.querySelectorAll('.menu.open').forEach((item) => {
          if (item !== menu) item.classList.remove('open');
        });
        const open = menu.classList.toggle('open');
        trigger.setAttribute('aria-expanded', String(open));
      });
      menu.querySelectorAll('button').forEach((item) => {
        item.addEventListener('click', () => {
          menu.querySelectorAll('button').forEach((choice) => choice.classList.remove('selected'));
          item.classList.add('selected');
          const choice = item.childNodes[0].textContent.trim();
          trigger.querySelector('span').textContent = choice;
          menu.classList.remove('open');
          trigger.setAttribute('aria-expanded', 'false');
          if (row.hasAttribute('data-repeat-row')) {
            document.querySelector('#repeatPanel').classList.toggle('visible', choice !== '不重复');
          }
        });
      });
    });

    document.addEventListener('click', () => {
      document.querySelectorAll('.menu.open').forEach((menu) => menu.classList.remove('open'));
      document.querySelectorAll('.select-trigger').forEach((trigger) => trigger.setAttribute('aria-expanded', 'false'));
    });

    document.querySelectorAll('.color').forEach((color) => {
      color.addEventListener('click', () => {
        document.querySelectorAll('.color').forEach((item) => {
          item.classList.remove('selected');
          item.setAttribute('aria-checked', 'false');
        });
        color.classList.add('selected');
        color.setAttribute('aria-checked', 'true');
      });
    });

    document.querySelectorAll('.weekday').forEach((day) => {
      day.addEventListener('click', () => day.classList.toggle('selected'));
    });

    document.querySelector('#allDay').addEventListener('change', (event) => {
      document.querySelectorAll('[data-time]').forEach((button) => {
        button.hidden = event.target.checked;
      });
    });
  </script>
</body>
</html>
