const ico=(name)=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+svg(name)+'</svg>';
let currentState='available',checking=false;
const states={
available:{title:'新版本可以下载了',icon:'download',help:'安装包约 128 MB。下载完成并校验后，再由你确认安装。',primary:'下载更新',action:'start',meta:'128 MB',extra:'完整安装包'},
downloading:{title:'正在下载更新',icon:'download',help:'',primary:'暂停下载',action:'pause',progress:48,meta:'61.4 MB / 128 MB',extra:'2.1 MB/s · 约剩 32 秒'},
paused:{title:'下载已暂停',icon:'pause',help:'',primary:'继续下载',action:'resume',progress:48,meta:'61.4 MB / 128 MB',extra:'等待恢复'},
failed:{title:'下载失败，请重试下载',icon:'error',help:'暂时无法完成下载。请确认网络连接后重试。',primary:'重试下载',action:'retry',secondary:'稍后再试',secondaryAction:'later',progress:48,meta:'61.4 MB / 128 MB',extra:'下载已中断'},
ready:{title:'下载完成，可以安装了',icon:'check',help:'安装包完整性校验通过。安装时会暂时退出当前应用。',primary:'立即安装',action:'install',secondary:'稍后安装',secondaryAction:'later',progress:100,meta:'128 MB / 128 MB',extra:'已校验'}
};
function showUpdate(state,notify=true){
if(modal.open)modal.close();
const isAbout=state==='about';about.hidden=!isAbout;updatePage.hidden=isAbout;
document.querySelector('.breadcrumb strong').textContent=isAbout?'关于与支持':'版本更新';
if(isAbout){if(notify)parent.postMessage({kind:'update-preview-state',state},'*');return}
currentState=state;const data=states[state]||states.available;
const mobile=innerWidth<=650;
const help=data.help;
updatePage.innerHTML='<button class="update-back" data-update-action="about">'+ico('back')+'关于与支持</button><header class="update-heading"><img class="update-app-logo" src="'+logo+'" alt="Anoxia"><div><div class="update-eyebrow">ANOXIA / UPDATE</div><h1>发现新版本</h1><p>让日常使用，再顺手一点。</p></div></header><div class="release-version"><span>当前 2.5.2</span>'+ico('arrow')+'<strong>2.5.3</strong><span class="release-badge">新版本</span><span style="margin-left:auto">'+(mobile?'Android':'Windows')+'</span></div><section class="download-panel" data-state="'+state+'" aria-label="安装包下载"><div class="download-top"><span class="download-status-icon">'+ico(data.icon)+'</span><strong class="download-label" aria-live="polite">'+data.title+'</strong>'+(data.progress!==undefined?'<span class="download-percentage">'+data.progress+'<small style="font-size:12px">%</small></span>':'')+'</div>'+(data.progress!==undefined?'<div class="progress-track" role="progressbar" aria-label="下载进度" aria-valuenow="'+data.progress+'" aria-valuemin="0" aria-valuemax="100"><span style="width:'+data.progress+'%"></span></div>':'<div style="height:17px"></div>')+'<div class="download-meta"><span>'+data.meta+'</span><span>'+data.extra+'</span></div>'+(help?'<p class="download-help">'+help+'</p>':'')+'<div class="download-buttons">'+(state==='available'?'<button class="plain" data-update-action="later">稍后更新</button>':'')+(data.secondary?'<button class="secondary" data-update-action="'+data.secondaryAction+'">'+data.secondary+'</button>':'')+'<button class="primary-button" data-update-action="'+data.action+'">'+data.primary+ico(data.action==='pause'?'pause':state==='ready'||data.action==='later'?'arrow':'download')+'</button></div></section><section class="release-notes"><div class="release-notes-header"><h2>这次更新了什么</h2><time>2026.11.06</time></div><div class="release-item"><span class="release-number">01</span><div><h3>下载与更新</h3><p>改善切后台、锁屏后返回的下载恢复体验，减少中断带来的重复操作。</p></div></div><div class="release-item"><span class="release-number">02</span><div><h3>关于与支持</h3><p>重新整理版本、反馈和支持入口，让需要的信息更容易找到。</p></div></div><div class="release-item"><span class="release-number">03</span><div><h3>细节修复</h3><p>优化部分提示文案，统一 Anoxia 的品牌名称。</p></div></div></section><div class="update-footnote">'+ico('info')+'<span>下载完成后校验安装包；只有你确认后，才会开始安装。</span></div>';
const aboutTitle={available:'发现新版本 2.5.3',downloading:'正在下载 48%',paused:'下载已暂停',failed:'下载失败，请重试下载',ready:'更新已下载，待安装'};
document.getElementById('update-title').textContent=aboutTitle[state];document.getElementById('check-update').textContent=state==='ready'?'立即查看':'查看更新';
if(notify)parent.postMessage({kind:'update-preview-state',state},'*');
scrollTo(0,0);
}
updatePage.addEventListener('click',e=>{
const button=e.target.closest('[data-update-action]');if(!button)return;
switch(button.dataset.updateAction){case 'about':case 'later':showUpdate('about');break;case 'start':case 'resume':case 'retry':showUpdate('downloading');break;case 'pause':showUpdate('paused');break;case 'install':open('安装 Anoxia 2.5.3','<div class="install-checklist"><span>'+ico('check')+'安装包已完整下载</span><span>'+ico('check')+'完整性校验通过</span></div><p>安装时会暂时退出 Anoxia。准备好后，继续交给系统安装器。</p><button class="primary-button" id="confirm-install">继续安装</button>');document.getElementById('confirm-install').onclick=()=>{modal.close();toast('安装交互预览完成，未启动系统安装器')};break;}
});
document.getElementById('check-update').onclick=()=>{if(checking)return;if(document.getElementById('update-title').textContent!=='已是最新版本'){showUpdate(currentState);return}checking=true;const button=document.getElementById('check-update');button.disabled=true;button.textContent='检查中…';setTimeout(()=>{checking=false;button.disabled=false;showUpdate('available')},650)};
document.querySelector('.mobile-back').onclick=()=>{if(updatePage.hidden)toast('当前为设计预览');else showUpdate('about')};
window.addEventListener('message',e=>{if(e.data.kind==='preview-state')showUpdate(e.data.state,false)});
window.addEventListener('message',e=>{if(e.data.kind==='theme')document.documentElement.dataset.theme=e.data.theme});
}
let markup=document.getElementById('screen').innerHTML.replace(/ICON:(\w+)/g,(_,name)=>icon(name));
const css=document.getElementById('styles').innerHTML;let theme='light';
try{theme=localStorage.getItem('anoxia-about-design-theme')||'light'}catch{}
function setTheme(value){theme=value;document.documentElement.dataset.theme=theme;document.getElementById('theme').textContent=theme==='light'?'切换深色':'切换浅色';try{localStorage.setItem('anoxia-about-design-theme',theme)}catch{}document.querySelectorAll('iframe').forEach(f=>f.contentWindow.postMessage({kind:'theme',theme},'*'))}
document.querySelectorAll('iframe').forEach(f=>{f.srcdoc='<!doctype html><html lang="zh-CN" data-theme="'+theme+'"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+css+'</head><body>'+markup+'<script>('+boot.toString()+')()<\/script></body></html>'});
function setPreviewState(state){document.querySelectorAll('[data-preview-state]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.previewState===state)));document.querySelectorAll('iframe').forEach(f=>f.contentWindow.postMessage({kind:'preview-state',state},'*'))}document.querySelectorAll('[data-preview-state]').forEach(b=>b.onclick=()=>setPreviewState(b.dataset.previewState));window.addEventListener('message',e=>{if(e.data.kind==='update-preview-state')setPreviewState(e.data.state)});
document.getElementById('theme').onclick=()=>setTheme(theme==='light'?'dark':'light');window.addEventListener('message',e=>{if(e.data.kind==='theme-toggle')setTheme(theme==='light'?'dark':'light')});
function fit(){document.querySelectorAll('.holder').forEach(holder=>{const device=holder.querySelector('.device');const scale=Math.min(1,holder.clientWidth/(holder.closest('.phone')?390:1180));device.style.transform='scale('+scale+')';holder.style.height=(holder.closest('.phone')?990:1020)*scale+'px'})}
document.querySelectorAll('.segmented button').forEach(b=>b.onclick=()=>{document.body.dataset.view=b.dataset.view;document.querySelectorAll('.segmented button').forEach(other=>other.setAttribute('aria-pressed',String(other===b)));requestAnimationFrame(fit)});new ResizeObserver(fit).observe(document.querySelector('.boards'));window.addEventListener('resize',fit);setTheme(theme);fit();
</script></body></html>
