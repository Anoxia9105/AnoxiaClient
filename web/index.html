<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Anoxia">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Anoxia</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f5f7fb;
    }

    #anoxia-loading {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 38%, rgba(79, 70, 229, 0.12), transparent 34%),
        #f5f7fb;
      color: #202334;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: opacity 220ms ease, visibility 220ms ease;
    }

    #anoxia-loading.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .anoxia-loading-logo {
      width: 88px;
      height: 88px;
      border-radius: 22px;
    }

    @media (prefers-color-scheme: dark) {
      html, body { background: #11131a; }

      #anoxia-loading {
        color: #f3f4f6;
        background:
          radial-gradient(circle at 50% 38%, rgba(129, 140, 248, 0.16), transparent 34%),
          #11131a;
      }
    }

    @keyframes anoxia-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="anoxia-loading" role="status" aria-live="polite">
    <img class="anoxia-loading-logo" src="icons/Icon-192.png" alt="Anoxia">
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('anoxia-loading');
      if (!loading) return;
      loading.classList.add('is-hidden');
      window.setTimeout(() => loading.remove(), 240);
    }, { once: true });

    // 禁用浏览器默认右键菜单，右键交互全部交由 Flutter 处理（消息/会话等）
    window.addEventListener('contextmenu', function (event) {
      event.preventDefault();
    }, false);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
