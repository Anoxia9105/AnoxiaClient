<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Anoxia - A high-performance, real-time instant messaging client for cross-platform multi-device sync.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Anoxia">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Anoxia</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f5f7fb;
    }

    #anoxia-loading {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 38%, rgba(79, 70, 229, 0.12), transparent 34%),
        #f5f7fb;
      color: #202334;
      --anoxia-accent: #4f46e5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: opacity 220ms ease, visibility 220ms ease;
    }

    #anoxia-loading.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .anoxia-loading-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .anoxia-loading-logo {
      width: 88px;
      height: 88px;
      border-radius: 22px;
    }

    .anoxia-loading-hint {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 28px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      transition: opacity 300ms ease, transform 300ms ease, visibility 300ms ease;
    }

    #anoxia-loading.is-slow .anoxia-loading-hint {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .anoxia-loading-spinner {
      width: 18px;
      height: 18px;
      flex: none;
      border-radius: 50%;
      border: 2px solid var(--anoxia-accent);
      border-top-color: transparent;
      opacity: 0.9;
      animation: anoxia-spin 0.9s linear infinite;
    }

    .anoxia-loading-hint-text {
      font-size: 14px;
      line-height: 1.5;
      opacity: 0.85;
    }

    @media (prefers-color-scheme: dark) {
      html, body { background: #11131a; }

      #anoxia-loading {
        color: #f3f4f6;
        --anoxia-accent: #818cf8;
        background:
          radial-gradient(circle at 50% 38%, rgba(129, 140, 248, 0.16), transparent 34%),
          #11131a;
      }
    }

    /* 小屏手机（SP）适配：确保加载层在移动端视口内完整可见 */
    @media screen and (max-width: 600px) {
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f5f7fb;
      }

      @media (prefers-color-scheme: dark) {
        html, body { background: #11131a; }
      }

      #anoxia-loading {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 50% 38%, rgba(79, 70, 229, 0.12), transparent 34%),
          #f5f7fb;
        color: #202334;
        --anoxia-accent: #4f46e5;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      #anoxia-loading.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .anoxia-loading-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .anoxia-loading-logo {
        width: 64px;
        height: 64px;
        border-radius: 16px;
      }

      .anoxia-loading-hint {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 20px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(6px);
        transition: opacity 300ms ease, transform 300ms ease, visibility 300ms ease;
      }

      #anoxia-loading.is-slow .anoxia-loading-hint {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      .anoxia-loading-spinner {
        width: 16px;
        height: 16px;
        flex: none;
        border-radius: 50%;
        border: 2px solid var(--anoxia-accent);
        border-top-color: transparent;
        opacity: 0.9;
        animation: anoxia-spin 0.9s linear infinite;
      }

      .anoxia-loading-hint-text {
        font-size: 12px;
        line-height: 1.5;
        opacity: 0.85;
        text-align: center;
        padding: 0 16px;
      }

      @media (prefers-color-scheme: dark) {
        #anoxia-loading {
          color: #f3f4f6;
          --anoxia-accent: #818cf8;
          background:
            radial-gradient(circle at 50% 38%, rgba(129, 140, 248, 0.16), transparent 34%),
            #11131a;
        }
      }

      @keyframes anoxia-spin {
        to { transform: rotate(360deg); }
      }
    }

    @keyframes anoxia-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="anoxia-loading" role="status" aria-live="polite">
    <div class="anoxia-loading-inner">
      <img class="anoxia-loading-logo" src="icons/Icon-192.png" alt="Anoxia">
      <div class="anoxia-loading-hint" aria-hidden="true">
        <span class="anoxia-loading-spinner"></span>
        <span class="anoxia-loading-hint-text" id="anoxia-loading-hint-text">First load may take a moment. Please be patient…</span>
      </div>
    </div>
  </div>
  <script>
    // 与 SystemLocale shim 一致，用 navigator.language 解析启动语言，加载屏文本按语言本地化
    (function () {
      var text = document.getElementById('anoxia-loading-hint-text');
      if (!text) return;
      var lang = window.navigator && (window.navigator.language || '').toLowerCase() || '';
      var map = {
        zh: '首次加载会耗费点时间，请耐心等待…',
        ja: '初回ロードには少し時間がかかります。しばらくお待ちください…'
      };
      var key = /^zh/.test(lang) ? 'zh' : (/^ja/.test(lang) ? 'ja' : 'en');
      text.textContent = map[key] || text.textContent;
    })();

    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('anoxia-loading');
      if (!loading) return;
      loading.classList.add('is-hidden');
      window.setTimeout(() => loading.remove(), 240);
    }, { once: true });

    // 超过 5 秒仍未见首帧（首次加载需下载 Flutter/Wasm 资源），显示加载提示
    window.setTimeout(function () {
      const loading = document.getElementById('anoxia-loading');
      if (!loading) return;
      loading.classList.add('is-slow');
    }, 5000);

    // Web SP（小屏手机）模式下，将加载层强制移至 DOM 最末端并确保 z-index 最高，
    // 防止 Flutter skwasm/canvaskit canvas 在移动端视口将其遮挡。
    (function () {
      var ld = document.getElementById('anoxia-loading');
      if (!ld) return;
      ld.style.zIndex = '2147483647';
      document.body.appendChild(ld);
    })();

    // 禁用浏览器默认右键菜单，右键交互全部交由 Flutter 处理（消息/会话等）
    window.addEventListener('contextmenu', function (event) {
      event.preventDefault();
    }, false);

    // 注意：切勿在此处手动 pushState / 监听 popstate 补历史条目（哨兵历史）！
    // Flutter 引擎（SingleEntryBrowserHistory）自维护 origin/flutter 两个历史
    // 条目，tearDown 时 go(-1) 后要求当前条目必须是 origin；哨兵在 popstate
    // 中 pushState(null) 会破坏该不变量，WASM 下直接抛未捕获异常
    // （history.dart:287 断言 / release 下 NullError）。
    // 浏览器返回/前进已在 Flutter 层由 WebNavigationBlocker 拦截。
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
