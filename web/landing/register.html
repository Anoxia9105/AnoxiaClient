<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anoxia IM - 注册</title>
    <meta name="description" content="Anoxia IM 注册页面">
    <link rel="icon" href="app_icon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --bg-dark: #0a0a0f;
            --bg-card: rgba(255, 255, 255, 0.03);
            --bg-card-hover: rgba(255, 255, 255, 0.06);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.72);
            --border: rgba(255, 255, 255, 0.1);
            --radius-md: 12px;
            --radius-lg: 20px;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #34d399;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Outfit', 'Space Grotesk', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        .gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% -20%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse 40% 30% at 50% 50%, rgba(6, 182, 212, 0.05) 0%, transparent 50%);
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            overflow: hidden;
            position: relative;
            z-index: 2;
        }

        .header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
        }

        .title {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .subtitle {
            margin: 8px 0 0;
            color: var(--text-secondary);
            font-size: 14px;
        }

        form {
            padding: 22px;
            display: grid;
            gap: 14px;
        }

        .field {
            display: grid;
            gap: 8px;
        }

        .label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        input {
            width: 100%;
            border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.55);
            color: var(--text-primary);
            padding: 12px 14px;
            border-radius: var(--radius-md);
            font-size: 15px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        input:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.22);
        }

        .captcha-row {
            display: grid;
            grid-template-columns: 1fr 120px;
            gap: 10px;
        }

        .captcha-box {
            width: 120px;
            height: 44px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: #0f172a;
            display: grid;
            place-items: center;
            overflow: hidden;
            cursor: pointer;
            user-select: none;
        }

        .captcha-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .actions {
            display: grid;
            gap: 10px;
            margin-top: 4px;
        }

        button,
        .btn-link {
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #06b6d4 100%);
            color: #fff;
        }

        .btn-primary:hover {
            filter: brightness(1.06);
        }

        .btn-secondary {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .status {
            padding: 0 22px 18px;
            min-height: 24px;
            font-size: 13px;
        }

        .status.error { color: var(--danger); }
        .status.warn { color: var(--warning); }
        .status.success { color: #86efac; }

        .footer {
            padding: 0 22px 22px;
            color: var(--text-secondary);
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="noise-overlay"></div>
    <div class="gradient-bg"></div>
    <main class="card">
        <header class="header">
            <h1 class="title">注册 Anoxia 账号</h1>
            <p class="subtitle">注册成功后可一键返回客户端继续登录</p>
        </header>

        <form id="register-form">
            <div class="field">
                <label class="label" for="username">用户名</label>
                <input id="username" name="username" maxlength="20" autocomplete="username" placeholder="2-20位，字母/数字/下划线，不能数字开头" required>
            </div>

            <div class="field">
                <label class="label" for="password">密码</label>
                <input id="password" name="password" type="password" minlength="5" maxlength="50" autocomplete="new-password" placeholder="请输入 5-50 位密码" required>
            </div>

            <div class="field">
                <label class="label" for="confirmPassword">确认密码</label>
                <input id="confirmPassword" name="confirmPassword" type="password" minlength="5" maxlength="50" autocomplete="new-password" placeholder="再次输入密码" required>
            </div>

            <div class="field">
                <label class="label" for="code">验证码</label>
                <div class="captcha-row">
                    <input id="code" name="code" maxlength="4" autocomplete="off" placeholder="请输入验证码" required>
                    <div class="captcha-box" id="captcha-box" title="点击刷新验证码">
                        <img id="captcha-img" alt="验证码">
                    </div>
                </div>
            </div>

            <div class="actions">
                <button class="btn-primary" id="submit-btn" type="submit">完成注册</button>
                <a class="btn-link btn-secondary" href="index.html">返回官网</a>
            </div>
        </form>

        <div id="status" class="status"></div>

        <div class="footer" id="footer-tip">注册完成后将自动返回客户端登录</div>
    </main>

    <script>
        const API_BASE = 'https://chat.anoxia.cn/api';
        const params = new URLSearchParams(window.location.search);
        const callback = params.get('callback') || 'anoxia://auth/register-complete';

        const form = document.getElementById('register-form');
        const statusBox = document.getElementById('status');
        const submitBtn = document.getElementById('submit-btn');
        const footerTip = document.getElementById('footer-tip');
        const captchaImg = document.getElementById('captcha-img');
        const captchaBox = document.getElementById('captcha-box');

        let captchaUuid = '';
        let registeredUsername = '';

        function setStatus(text, type = '') {
            statusBox.textContent = text || '';
            statusBox.className = 'status' + (type ? ' ' + type : '');
        }

        async function loadCaptcha(preserveStatus = false) {
            try {
                if (!preserveStatus) {
                    setStatus('');
                }
                const res = await fetch(`${API_BASE}/captchaImage`, { method: 'GET' });
                const data = await res.json();
                captchaUuid = data.uuid || data?.data?.uuid || '';
                const img = data.img || data?.data?.img || '';
                if (!captchaUuid || !img) {
                    setStatus('验证码加载失败，请重试', 'error');
                    return;
                }
                captchaImg.src = `data:image/jpeg;base64,${img}`;
            } catch (err) {
                setStatus('验证码加载失败，请检查网络', 'error');
            }
        }

        function validateForm(payload) {
            if (!/^[a-zA-Z_]\w{1,19}$/.test(payload.username)) {
                return '用户名格式不正确';
            }
            if (payload.password.length < 5 || payload.password.length > 50) {
                return '密码长度需在 5-50 位之间';
            }
            if (payload.password !== payload.confirmPassword) {
                return '两次密码输入不一致';
            }
            if (!payload.code || payload.code.length < 1) {
                return '请输入验证码';
            }
            if (!captchaUuid) {
                return '验证码未加载完成，请刷新';
            }
            return '';
        }

        function buildReturnUri(username) {
            const separator = callback.includes('?') ? '&' : '?';
            return `${callback}${separator}username=${encodeURIComponent(username)}`;
        }

        function onRegisterSuccess(username) {
            registeredUsername = username;
            footerTip.textContent = '注册成功，正在尝试返回客户端...';
            setTimeout(() => {
                window.location.href = buildReturnUri(username);
            }, 650);
        }

        function clearRegisterSuccessState() {
            registeredUsername = '';
            footerTip.textContent = '注册完成后将自动返回客户端登录';
        }

        function normalizeApiResult(raw, fallbackOk = false) {
            if (typeof raw === 'string') {
                const plain = raw.trim();
                return {
                    isSuccess: false,
                    code: null,
                    msg: plain,
                };
            }

            const codeRaw = raw?.code ?? raw?.data?.code;
            const msgRaw = raw?.msg ?? raw?.message ?? raw?.data?.msg ?? raw?.data?.message;
            const code = Number(codeRaw);
            const isSuccess = Number.isFinite(code)
                ? code === 200
                : Boolean(fallbackOk);

            return {
                isSuccess,
                code: Number.isFinite(code) ? code : null,
                msg: (msgRaw ?? '').toString().trim(),
            };
        }

        async function submitRegister(evt) {
            evt.preventDefault();

            const payload = {
                username: form.username.value.trim(),
                password: form.password.value,
                confirmPassword: form.confirmPassword.value,
                code: form.code.value.trim(),
                uuid: captchaUuid,
            };

            const errorMsg = validateForm(payload);
            if (errorMsg) {
                setStatus(errorMsg, 'warn');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '提交中...';
            setStatus('正在提交注册...', 'warn');

            try {
                const res = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: payload.username,
                        password: payload.password,
                        code: payload.code,
                        uuid: payload.uuid,
                    }),
                });

                const rawText = await res.text();
                let data;
                try {
                    data = rawText ? JSON.parse(rawText) : {};
                } catch (_) {
                    // 非 JSON 响应（例如 500 纯文本）也保留原始错误信息
                    data = rawText;
                }

                const result = normalizeApiResult(data, res.ok);
                if (!result.isSuccess) {
                    const errorMsg = result.msg || '注册失败，请稍后重试';
                    clearRegisterSuccessState();
                    setStatus(errorMsg, 'error');
                    await loadCaptcha(true);
                    return;
                }

                const successMsg = result.msg || '注册成功';
                setStatus(`${successMsg}，正在唤起客户端...`, 'success');
                onRegisterSuccess(payload.username);
            } catch (err) {
                clearRegisterSuccessState();
                setStatus('注册失败，请检查网络后重试', 'error');
                await loadCaptcha(true);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '完成注册';
            }
        }

        form.addEventListener('submit', submitRegister);
        captchaBox.addEventListener('click', loadCaptcha);

        loadCaptcha();
    </script>
</body>
</html>
